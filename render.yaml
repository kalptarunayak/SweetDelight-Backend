services:
  - type: web
    name: sweetdelight-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/ping
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: COD_ENABLED
        value: "true"
      - key: NOTIFY_MODE
        value: "console"
      - key: SWAGGER_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://your-github-username.github.io"
